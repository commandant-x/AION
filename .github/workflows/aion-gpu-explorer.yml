name: PRIMORDIA GPU Explorer (Windows + Linux)
on:
  push:
    paths:
      - 'Cargo.toml'
      - 'crates/aion-world/**'
      - 'crates/aion-explore/**'
      - '.github/workflows/aion-gpu-explorer.yml'
      - 'tests/validate_hydro_015.py'
      - 'tests/validate_hydro_015.py'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'crates/aion-world/**'
      - 'crates/aion-explore/**'
      - '.github/workflows/aion-gpu-explorer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gpu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libwayland-dev libxkbcommon-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - name: Geometry, movement and world tests
        run: cargo test -p aion-world -p aion-explore --all-targets
      - name: Release GPU explorer binary
        run: cargo build --release -p aion-explore
      - name: Headless deterministic test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            ./target/release/aion-explore.exe --self-test
          else
            ./target/release/aion-explore --self-test
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conservative hydrothermal benchmark (61 observations)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            ./target/release/aion-explore.exe --hydro-benchmark hydro-015.csv
          else
            ./target/release/aion-explore --hydro-benchmark hydro-015.csv
          fi
          python tests/validate_hydro_015.py hydro-015.csv
      - name: Native Win32 window smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$PWD/target/release/aion-explore.exe" -ArgumentList '--window-smoke' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Win32 window smoke failed with code $($proc.ExitCode)" }
      - name: Publish Windows application and sources
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PRIMORDIA-GPU-EXPLORER-WIN64
          path: |
            target/release/aion-explore.exe
            hydro-015.csv
            crates/aion-world/src/hydrothermal.rs
            crates/aion-explore/MODEL_015.md
            tests/validate_hydro_015.py
          if-no-files-found: error